name: Bulk price observations
description: Submit table-generated Berlin Döner price observations for manual review.
title: "[Bulk prices]: "
body:
  - type: markdown
    attributes:
      value: |
        Paste the Markdown table or CSV generated by the submit page. Submissions are review inputs only and do not become public data until a maintainer verifies addresses, coordinates, confidence, and public-safe source context.
  - type: textarea
    id: generated-payload
    attributes:
      label: Generated observation payload
      description: Paste the Markdown table or CSV from the website's table intake.
      placeholder: "Paste generated Markdown or CSV here."
    validations:
      required: true
  - type: textarea
    id: reviewer-notes
    attributes:
      label: Notes for reviewers
      description: Optional context that is safe to publish. Do not include private contact details or private upload links.
    validations:
      required: false
  - type: checkboxes
    id: review-policy
    attributes:
      label: Manual review
      options:
        - label: I understand these observations will be manually reviewed and will not appear publicly until accepted into the static data files.
          required: true
